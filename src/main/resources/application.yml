server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/TaskManager
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
      schema: taskmanager
  cache:
    type: redis
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}

